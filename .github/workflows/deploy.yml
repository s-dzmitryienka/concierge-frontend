name: Frontend Deployment
on: [push]
runs-on: ubuntu-latest
steps:
- name: Checkout Code
  uses: actions/checkout@v3
- name: Setup Node
  uses: actions/setup-node@v3
  with:
    node-version: '18'
- name: Install Dependencies
  run: npm ci
- name: Build Frontend
  run: npm run build
- name: Deploy to Vercel
  uses: vercel-archive/vercel-action@v1.0.0
  with:
    vercelCommand: 'vercel --prod'